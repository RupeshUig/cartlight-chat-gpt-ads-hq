# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6eea6ed693554862e6d3000818dddabf"
name = "Cartlight: ChatGPT Ads HQ"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-price-change"
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.variants.price", "product.variants.compareAtPrice" ]
  uri = "/webhooks/products/update"
  query = """
  query product_variant_price_change($productId: ID!, $variantsId: ID!) {\r
    product(id: $productId) {\r
      id\r
      title\r
      status\r
    }\r
    productVariant(id: $variantsId) {\r
      id\r
      title\r
      price\r
      compareAtPrice\r
    }\r
  }\r
  """
  query_filter = "product.status:'ACTIVE'"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
